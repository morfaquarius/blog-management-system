services:
  db:
    image: postgres:15-alpine
    container_name: blog_postgres_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-blog_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-blog_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Раскомментируйте сервис после реализации HTTP-сервера в api/main.go.
  # Пока точка входа является заглушкой, приложение не обслуживает API.
  # app:
  #   build: .
  #   container_name: blog_api
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     DB_HOST: db
  #     DB_PORT: 5432
  #     DB_USER: ${DB_USER:-postgres}
  #     DB_PASSWORD: ${DB_PASSWORD:-postgres}
  #     DB_NAME: ${DB_NAME:-blog_db}
  #     DB_SSLMODE: disable
  #     JWT_SECRET: ${JWT_SECRET:?Задайте JWT_SECRET в .env}
  #     JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
  #     MIGRATIONS_DIR: /app/migrations
  #     EVENT_LOG_PATH: /app/logs.txt
  #     SERVER_HOST: 0.0.0.0
  #     SERVER_PORT: 8080
  #   depends_on:
  #     db:
  #       condition: service_healthy

volumes:
  postgres_data:
